[package]
name = "altload_ffi"
version = "0.2.0"
edition = "2021"
description = "C FFI for Reloader (a personal build of AltLoad): iOS 27 wireless pairing (idevice) + on-device sideloading (isideload)"

[lib]
name = "altload_ffi"
crate-type = ["staticlib"]

[dependencies]
# Device side: pairing host, RPPairing tunnel to this device, AFC + installation_proxy over RSD.
idevice = { version = "0.1.61", default-features = false, features = [
  "remote_pairing",
  "rsd",
  "tunnel_tcp_stack",
  "afc",
  "installation_proxy",
  "misagent",
  "house_arrest",
  # Tools › JIT and Location: Developer Disk Image (cryptex), DVT, debugserver.
  "cryptexd",
  "dvt",
  "location_simulation",
  "debug_proxy",
  "tcp",
  "ring",
] }
# Apple ID sign-in (GSA + anisette), developer portal (device, App IDs, profiles), code signing.
# Exactly the version iloader 2.4.1 signs in with: 0.5.1 added the client-info override
# and 0.5.2 sends that client info with the URL bag request too. Apple keeps changing
# GrandSlam, so move only when iloader does.
isideload = { version = "=0.5.2", default-features = false, features = ["install", "keyring-storage", "tokio-mt"] }
# Importing iloader's key (.p12 or raw) and finding its certificate on the account.
# The versions isideload uses, so the key and certificate are the very types
# CertificateIdentity holds.
rsa = "0.9.10"
x509-cert = "0.2.5"
sha2 = "0.11"
hex = "0.4.3"
base64 = "0.22.1"
p12-keystore = { version = "0.3.0-rc4", package = "isideload-p12-keystore" }
rootcause = "0.12.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "time", "sync"] }
serde_json = "1"
plist = "1.8"
zip = { version = "8.3", default-features = false, features = ["deflate"] }

# isideload pulls idevice from crates.io; pin both to the same recent git revision so
# the tunnel types we build (AdapterHandle / RsdHandshake) are the ones it accepts.
[patch.crates-io]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "d32c8189c51c2789496b0768039419c3705498c3" }

[profile.release]
opt-level = 3
lto = "thin"
